name: Build Linux Binary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - "deploy/systemd/**"
      - "config.toml.example"
      - ".github/workflows/build-linux-binary.yml"

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directories
        run: |
          mkdir -p dist

      - name: Install dependencies
        run: |
          docker --version
          docker pull quay.io/pypa/manylinux2014_x86_64

      - name: Build standalone binary
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euxo pipefail
              ls -1 /opt/python || true

              # Build a guaranteed shared CPython against manylinux2014 (glibc 2.17 baseline).
              PYVER=3.11.9
              PYHOME=/tmp/py311shared
              PYBIN=$PYHOME/bin/python3.11
              OPENSSL_VER=1.1.1w
              OPENSSL_HOME=/tmp/openssl111

              yum -y install \
                gcc make wget tar xz bzip2-devel libffi-devel zlib-devel perl-core \
                readline-devel sqlite-devel gdbm-devel ncurses-devel

              cd /tmp

              # Build OpenSSL 1.1 for Python SSL support on CentOS 7 based images.
              wget -q https://www.openssl.org/source/openssl-${OPENSSL_VER}.tar.gz
              tar -xzf openssl-${OPENSSL_VER}.tar.gz
              cd openssl-${OPENSSL_VER}
              ./config --prefix=$OPENSSL_HOME --openssldir=$OPENSSL_HOME shared zlib
              make -j2
              make install_sw

              cd /tmp
              wget -q https://www.python.org/ftp/python/${PYVER}/Python-${PYVER}.tgz
              tar -xzf Python-${PYVER}.tgz
              cd Python-${PYVER}
              ./configure --prefix=$PYHOME --enable-shared --with-ensurepip=install --with-openssl=$OPENSSL_HOME \
                CPPFLAGS="-I$OPENSSL_HOME/include" \
                LDFLAGS="-Wl,-rpath,$PYHOME/lib -Wl,-rpath,$OPENSSL_HOME/lib -L$OPENSSL_HOME/lib"
              make -j2
              make install

              "$PYBIN" -V
              "$PYBIN" -c "import ssl; print(ssl.OPENSSL_VERSION)"
              "$PYBIN" -m pip install --upgrade pip
              "$PYBIN" -m pip install -r /work/requirements.txt
              "$PYBIN" -m pip install pyinstaller
              cd /work
              PYTHONPATH=src "$PYBIN" -m PyInstaller --onefile --name server-monitoring src/server_monitoring/__main__.py
            '

      - name: Verify binary exists
        run: |
          ls -lah dist
          test -f dist/server-monitoring

      - name: Assemble deployment bundle
        run: |
          mkdir -p artifact/bin
          mkdir -p artifact/deploy/systemd
          cp dist/server-monitoring artifact/bin/server-monitoring
          chmod +x artifact/bin/server-monitoring
          cp config.toml.example artifact/config.toml
          cp deploy/systemd/server-monitor-binary-wildfly.service artifact/deploy/systemd/
          cp deploy/systemd/server-monitor-binary.service artifact/deploy/systemd/
          cp deploy/systemd/server-monitor-binary.timer artifact/deploy/systemd/
          cp README.md artifact/README.md
          tar -czf server-monitoring-linux-x86_64.tar.gz -C artifact .
          sha256sum server-monitoring-linux-x86_64.tar.gz > server-monitoring-linux-x86_64.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-monitoring-linux-x86_64
          path: |
            server-monitoring-linux-x86_64.tar.gz
            server-monitoring-linux-x86_64.sha256
          if-no-files-found: error
