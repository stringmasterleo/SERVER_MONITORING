name: Build Linux Binary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - "deploy/systemd/**"
      - "config.toml.example"
      - ".github/workflows/build-linux-binary.yml"

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directories
        run: |
          mkdir -p dist

      - name: Install dependencies
        run: |
          docker --version
          docker pull quay.io/pypa/manylinux2014_x86_64

      - name: Build standalone binary
        env:
          PYTHONPATH: src
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euxo pipefail
              ls -1 /opt/python || true

              PYBIN=""
              for candidate in \
                /opt/python/cp311-cp311/bin/python \
                /opt/python/cp310-cp310/bin/python \
                /opt/python/cp39-cp39/bin/python \
                /usr/bin/python3 \
                /usr/bin/python; do
                if [ -x "$candidate" ]; then
                  if "$candidate" -c "import sysconfig; import os; print(sysconfig.get_config_var('Py_ENABLE_SHARED') or 0)" | grep -qx "1"; then
                    PYBIN="$candidate"
                    break
                  fi
                fi
              done

              if [ -z "$PYBIN" ]; then
                echo "No Python interpreter with shared lib support found in build image"
                for candidate in /opt/python/*/bin/python /usr/bin/python3 /usr/bin/python; do
                  if [ -x "$candidate" ]; then
                    echo "Candidate: $candidate"
                    "$candidate" -V || true
                    "$candidate" -c "import sysconfig; print('Py_ENABLE_SHARED=', sysconfig.get_config_var('Py_ENABLE_SHARED'))" || true
                  fi
                done
                exit 1
              fi

              "$PYBIN" -V
              "$PYBIN" -m pip install --upgrade pip
              "$PYBIN" -m pip install -r requirements.txt
              "$PYBIN" -m pip install pyinstaller
              PYTHONPATH=src "$PYBIN" -m PyInstaller --onefile --name server-monitoring src/server_monitoring/__main__.py
            '

      - name: Verify binary exists
        run: |
          ls -lah dist
          test -f dist/server-monitoring

      - name: Assemble deployment bundle
        run: |
          mkdir -p artifact/bin
          mkdir -p artifact/deploy/systemd
          cp dist/server-monitoring artifact/bin/server-monitoring
          chmod +x artifact/bin/server-monitoring
          cp config.toml.example artifact/config.toml
          cp deploy/systemd/server-monitor-binary-wildfly.service artifact/deploy/systemd/
          cp deploy/systemd/server-monitor-binary.service artifact/deploy/systemd/
          cp deploy/systemd/server-monitor-binary.timer artifact/deploy/systemd/
          cp README.md artifact/README.md
          tar -czf server-monitoring-linux-x86_64.tar.gz -C artifact .
          sha256sum server-monitoring-linux-x86_64.tar.gz > server-monitoring-linux-x86_64.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-monitoring-linux-x86_64
          path: |
            server-monitoring-linux-x86_64.tar.gz
            server-monitoring-linux-x86_64.sha256
          if-no-files-found: error
