name: Build Linux Binary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - "deploy/systemd/**"
      - "config.toml.example"
      - ".github/workflows/build-linux-binary.yml"

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux2014_x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install --upgrade pip
          /opt/python/cp311-cp311/bin/python -m pip install -r requirements.txt
          /opt/python/cp311-cp311/bin/python -m pip install pyinstaller

      - name: Build standalone binary
        env:
          PYTHONPATH: src
        run: |
          /opt/python/cp311-cp311/bin/pyinstaller --onefile --name server-monitoring src/server_monitoring/__main__.py

      - name: Assemble deployment bundle
        run: |
          mkdir -p artifact/bin
          mkdir -p artifact/deploy/systemd
          cp dist/server-monitoring artifact/bin/server-monitoring
          chmod +x artifact/bin/server-monitoring
          cp config.toml.example artifact/config.toml
          cp deploy/systemd/server-monitor-binary-wildfly.service artifact/deploy/systemd/
          cp deploy/systemd/server-monitor-binary.service artifact/deploy/systemd/
          cp deploy/systemd/server-monitor-binary.timer artifact/deploy/systemd/
          cp README.md artifact/README.md
          tar -czf server-monitoring-linux-x86_64.tar.gz -C artifact .
          sha256sum server-monitoring-linux-x86_64.tar.gz > server-monitoring-linux-x86_64.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-monitoring-linux-x86_64
          path: |
            server-monitoring-linux-x86_64.tar.gz
            server-monitoring-linux-x86_64.sha256
          if-no-files-found: error
